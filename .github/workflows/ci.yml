name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            testbench: '^10.0'
            phpunit: '^11.0'
          - php: '8.4'
            testbench: '^11.0'
            phpunit: '^12.0'
          - php: '8.5'
            testbench: '^11.0'
            phpunit: '^12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, openssl, sqlite3, pdo_sqlite
          coverage: none
      - run: composer validate --strict
      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-update
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/phpunit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=512M
